<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lineare Gleichungssysteme">
  <rect width="512" height="512" rx="96" fill="#002C5C"/>
  <g
    font-family="Segoe UI, Arial, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#ffffff"
  >
    <text x="256" y="188" text-anchor="middle">x + y + z = 6</text>
    <text x="256" y="278" text-anchor="middle">2x - y + z = 3</text>
    <text x="256" y="368" text-anchor="middle">x + 2y - z = 2</text>
  </g>
</svg>
